<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">


  
// 댓글 기능
let currentCommentTarget = '';

async function openCommentModal(name) {
  currentCommentTarget = name;
  document.getElementById('commentTarget').textContent = name + '님에게 응원을';
  document.getElementById('commentModal').classList.add('show');
  document.getElementById('commentInput').value = '';
  await loadComments(name);
}

function closeCommentModal() {
  document.getElementById('commentModal').classList.remove('show');
}

async function loadComments(name) {
  const list = document.getElementById('commentList');
  list.innerHTML = '<div class="comment-empty">불러오는 중...</div>';
  const { data, error } = await sb.from('comments_june')
    .select('*')
    .eq('target_name', name)
    .order('created_at', { ascending: false });
  if (error || !data.length) {
    list.innerHTML = '<div class="comment-empty">아직 댓글이 없어요. 첫 응원을 남겨보세요! 🎉</div>';
    return;
  }
  list.innerHTML = data.map(c => `
    <div class="comment-item">
      ${c.message}
      <div class="comment-time">${new Date(c.created_at).toLocaleDateString('ko-KR', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
    </div>
  `).join('');
}

async function sendComment() {
  const input = document.getElementById('commentInput');
  const msg = input.value.trim();
  if (!msg) return;
  const { error } = await sb.from('comments_june').insert({
    target_name: currentCommentTarget,
    message: msg
  });
  if (error) { showToast('댓글 전송 실패', true); return; }
  input.value = '';
  showToast('응원 메시지 전송! 💪');
  await loadComments(currentCommentTarget);
}

// 모달 바깥 클릭 시 닫기
document.getElementById('commentModal').addEventListener('click', function(e) {
  if (e.target === this) closeCommentModal();
});

<script>
const SUPABASE_URL = 'https://arihsbwunsmxwsutdmip.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyaWhzYnd1bnNteHdzdXRkbWlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDI1NzIsImV4cCI6MjA5MzYxODU3Mn0.WAP57fA9_V1YDjtPv-BmIkWHYHpss1OjRX38kORP2lI';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const GOALS = {
  '이혜경': 25, '김홍태': 25, '이주형': 25, '허영욱': 35, '박태현': 25,
  '인혜란': 35, '오상직': 40, '지용진': 35, '이현수': 40,
  '홍지원': 25, '권채은': 20, '안예지': 20
};

// 탭 전환
function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  event.target.classList.add('active');
  if (tab === 'dash') loadDashboard();
  if (tab === 'log') loadLog();
}

// 사진 미리보기
const photoFile = document.getElementById('photoFile');
const photoPreview = document.getElementById('photoPreview');
const photoDrop = document.getElementById('photoDrop');

photoFile.addEventListener('change', e => {
  if (e.target.files.length > 1) return;
  const file = e.target.files[0];
  if (file) showPreview(file);
});

photoDrop.addEventListener('dragover', e => { e.preventDefault(); photoDrop.classList.add('drag-over'); });
photoDrop.addEventListener('dragleave', () => photoDrop.classList.remove('drag-over'));
photoDrop.addEventListener('drop', e => {
  e.preventDefault();
  photoDrop.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) { photoFile.files = e.dataTransfer.files; showPreview(file); }
});

function showPreview(file) {
  const reader = new FileReader();
  reader.onload = e => {
    photoPreview.src = e.target.result;
    photoPreview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

// 파일 1장 제한
function checkSingleFile(input) {
  if (input.files.length > 1) {
    showToast('사진은 1장만 올려주세요!', true);
    input.value = '';
    photoPreview.style.display = 'none';
    return;
  }
  const file = input.files[0];
  if (file) showPreview(file);
}

// 인증 제출
async function submitRun() {
  const name = document.getElementById('name').value;
  const distance = parseFloat(document.getElementById('distance').value);
  const file = photoFile.files[0];

  if (!name) return showToast('이름을 선택해주세요', true);
  if (!distance || distance <= 0) return showToast('거리를 입력해주세요', true);
  if (!file) return showToast('인증 사진을 올려주세요', true);

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '제출 중...';

  try {
    // 사진 업로드
    const ext = file.name.split('.').pop();
    const safeName = Date.now() + "_" + Math.random().toString(36).substring(2, 8);
    const fileName = `run_${safeName}.${ext}`;
    const { error: uploadError } = await sb.storage.from('photos_june').upload(fileName, file);
    if (uploadError) throw uploadError;

    const { data: { publicUrl } } = sb.storage.from('photos_june').getPublicUrl(fileName);

    // DB 저장
    const { error: dbError } = await sb.from('runs_june').insert({
      name, distance, photo_url: publicUrl
    });
    if (dbError) throw dbError;

    showToast('인증 완료! 🎉');
    document.getElementById('name').value = '';
    document.getElementById('distance').value = '';
    photoFile.value = '';
    photoPreview.style.display = 'none';
  } catch (err) {
    showToast('오류가 발생했어요: ' + err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '인증 제출';
  }
}

// 대시보드 로드
async function loadDashboard() {
  const { data, error } = await sb.from('runs_june').select('*').order('submitted_at', { ascending: true });
  if (error) return;

  // 사람별 집계
  const byName = {};
  for (const r of data) {
    if (!byName[r.name]) byName[r.name] = { total: 0, runs: 0 };
    byName[r.name].total += r.distance;
    byName[r.name].runs += 1;
  }

  // 전체 통계
  const totalKm = data.reduce((s, r) => s + r.distance, 0);
  document.getElementById('totalKm').innerHTML = totalKm.toFixed(1) + '<span class="stat-unit">km</span>';

  // 가장 많이 달린 사람
  const topKm = Object.entries(byName).sort((a, b) => b[1].total - a[1].total)[0];
  if (topKm) {
    document.getElementById('topKmName').textContent = topKm[0];
    document.getElementById('topKmVal').textContent = topKm[1].total.toFixed(1) + 'km · ' + topKm[1].runs + '회 인증';
  }

  // 진척률 1위
  const topPct = Object.entries(byName).sort((a, b) => {
    return (b[1].total / (GOALS[b[0]] || 35)) - (a[1].total / (GOALS[a[0]] || 35));
  })[0];
  if (topPct) {
    const pct = (topPct[1].total / (GOALS[topPct[0]] || 35) * 100).toFixed(0);
    document.getElementById('topPctName').textContent = topPct[0];
    document.getElementById('topPctVal').textContent = pct + '% 달성 (' + topPct[1].total.toFixed(1) + 'km)';
  }

  // 참가자 카드
  const grid = document.getElementById('runnersGrid');
  grid.innerHTML = '';

  const sorted = ['권채은','김홍태','박태현','안예지','오상직','이주형','이현수','이혜경','인혜란','지용진','허영욱','홍지원'];

  // 댓글 수 로드
  const { data: commentCounts } = await sb.from('comments_june').select('target_name');
  const countMap = {};
  if (commentCounts) {
    for (const c of commentCounts) {
      countMap[c.target_name] = (countMap[c.target_name] || 0) + 1;
    }
  }

  for (const name of sorted) {
    const goal = GOALS[name];
    const total = byName[name]?.total || 0;
    const runs = byName[name]?.runs || 0;
    const rawPct = total / goal * 100;
    const pct = Math.min(rawPct, 100);
    const done = total >= goal;
    const over = total > goal;
    const close = !done && pct >= 80 && pct < 100;
    const isHard = goal >= 35;
    const isElite = goal >= 40;

    grid.innerHTML += `
      <div class="runner-card ${over ? 'over' : done ? 'done' : ''} ${isElite && !done ? 'elite' : isHard && !done ? 'hard' : ''}" onclick="goToLog('${name}')">
        <div class="runner-header">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="runner-name">${name}</div>
            ${isElite ? '<span class="hard-badge elite-badge">40km</span>' : isHard ? '<span class="hard-badge">35km</span>' : ''}
          </div>
          <div class="runner-badge ${over ? 'over' : done ? 'done' : close ? 'close' : ''}">
            ${over ? '🏆 초과달성' : done ? '✅ 달성' : close ? '🔥 임박' : '목표 ' + goal + 'km'}
          </div>
        </div>
        <div class="progress-bar" style="${isHard && !done ? 'height:8px;' : ''}">
          <div class="progress-fill ${over ? 'over' : done ? 'done' : close ? 'close' : isElite ? 'elite' : isHard ? 'hard' : ''}" style="width:${pct}%"></div>
        </div>
        <div class="runner-stats">
          <span><span class="runner-km">${total.toFixed(1)}km</span> / ${goal}km</span>
          <span>${runs}회 인증 · ${rawPct.toFixed(0)}%</span>
        </div>
        <button class="comment-btn" onclick="event.stopPropagation(); openCommentModal('${name}')">💬 응원 댓글 보기 ${countMap['${name}'] ? '(' + countMap['${name}'] + ')' : ''}</button>
      </div>`;
  }
}

// 인증 로그 로드
let allRunData = [];
let runOrderMap = {};

async function loadLog() {
  return new Promise(async (resolve) => {
  const { data, error } = await sb.from('runs_june').select('*').order('submitted_at', { ascending: false });
  if (error) return;

  // 회차 계산 (사람별 순서)
  const countByName = {};
  const reversed = [...data].reverse();
  for (const r of reversed) {
    countByName[r.name] = (countByName[r.name] || 0) + 1;
    runOrderMap[r.id] = countByName[r.name];
  }

  allRunData = data;
  renderLog(data);
  resolve();
  });
}

function goToLog(name) {
  // 인증로그 탭으로 이동
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-log').classList.add('active');
  document.querySelectorAll('nav button')[2].classList.add('active');

  // 해당 참가자 필터 적용
  loadLog().then(() => {
    const btn = [...document.querySelectorAll('.filter-btn')].find(b => b.textContent === name);
    filterLog(name, btn);
  });
}

function filterLog(name, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const filtered = name === '전체' ? allRunData : allRunData.filter(r => r.name === name);
  renderLog(filtered);
}

function renderLog(data) {
  const body = document.getElementById('logBody');
  if (!data.length) {
    body.innerHTML = '<div class="loading">인증 기록이 없어요</div>';
    return;
  }
  body.innerHTML = data.map((r, i) => `
    <div class="log-row">
      <div class="rank">${i + 1}</div>
      <div>${r.name}</div>
      <div style="font-weight:700">${r.distance.toFixed(1)}km</div>
      <div style="color:var(--muted)">${runOrderMap[r.id] || '-'}회차</div>
      <div class="log-date">${new Date(r.submitted_at).toLocaleDateString('ko-KR', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      <div>${r.photo_url ? `<button class="view-photo" onclick="openModal('${r.photo_url}')">보기</button>` : '-'}</div>
    </div>`).join('');
}

function openModal(url) {
  document.getElementById('modalImg').src = url;
  document.getElementById('photoModal').classList.add('show');
}
function closeModal() { document.getElementById('photoModal').classList.remove('show'); }

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}




// 댓글 기능
let currentCommentTarget = '';

async function openCommentModal(name) {
  currentCommentTarget = name;
  document.getElementById('commentTarget').textContent = name + '님에게 응원을';
  document.getElementById('commentModal').classList.add('show');
  document.getElementById('commentInput').value = '';
  await loadComments(name);
}

function closeCommentModal() {
  document.getElementById('commentModal').classList.remove('show');
}

async function loadComments(name) {
  const list = document.getElementById('commentList');
  list.innerHTML = '<div class="comment-empty">불러오는 중...</div>';
  const { data, error } = await sb.from('comments_june')
    .select('*')
    .eq('target_name', name)
    .order('created_at', { ascending: false });
  if (error || !data.length) {
    list.innerHTML = '<div class="comment-empty">아직 댓글이 없어요. 첫 응원을 남겨보세요! 🎉</div>';
    return;
  }
  list.innerHTML = data.map(c => `
    <div class="comment-item">
      ${c.message}
      <div class="comment-time">${new Date(c.created_at).toLocaleDateString('ko-KR', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
    </div>
  `).join('');
}

async function sendComment() {
  const input = document.getElementById('commentInput');
  const msg = input.value.trim();
  if (!msg) return;
  const { error } = await sb.from('comments_june').insert({
    target_name: currentCommentTarget,
    message: msg
  });
  if (error) { showToast('댓글 전송 실패', true); return; }
  input.value = '';
  showToast('응원 메시지 전송! 💪');
  await loadComments(currentCommentTarget);
}

// 모달 바깥 클릭 시 닫기
document.getElementById('commentModal').addEventListener('click', function(e) {
  if (e.target === this) closeCommentModal();
});
